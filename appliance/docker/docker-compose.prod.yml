# Production stack for the appliance. Paths below assume this whole repo
# is deployed to /opt/vcf-lic-mgmt on the guest (see ../README.md).
# Difference from the repo's top-level docker-compose.yml: frontend is a
# built nginx image instead of the Vite dev server, and nothing maps
# host ports other than 80/443 - the appliance is meant to be reached
# only through the frontend.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vcf
      POSTGRES_PASSWORD: vcf
      POSTGRES_DB: vcf_lic_mgmt
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcf -d vcf_lic_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vcf:vcf@db:5432/vcf_lic_mgmt
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Context is the repo root (not just frontend/) so this Dockerfile can
    # also pull in appliance/docker/frontend/nginx.conf.
    build:
      context: ../..
      dockerfile: appliance/docker/frontend/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  db_data:
